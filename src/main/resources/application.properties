spring.application.name=autoloc-api

# --- Base de données MySQL / MariaDB (XAMPP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

# --- Serveur : toutes les routes sont préfixées par /api ---
server.port=8082
server.servlet.context-path=/api

# --- SpringDoc : /api/swagger-ui.html et /api/v3/api-docs ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
